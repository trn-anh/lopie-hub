var SL = (function () {
  'use strict';

  /* ---------- Danh mục mặc định (Quản trị có thể sửa trong "Quy tắc & danh mục") ---------- */

  ];
  /* Loại hợp tác theo góp ý v1.2: mỗi loại bật riêng, không suy ra nhau */
  var NEED_TYPES = [
    { code: 'council', label: 'Tham gia hội đồng', hint: 'Hội đồng chấm, nghiệm thu theo bậc đào tạo.', leveled: true },
    { code: 'supervise', label: 'Hướng dẫn nghiên cứu', hint: 'Hướng dẫn khóa luận, luận văn theo bậc đào tạo.', leveled: true },
    { code: 'consult', label: 'Tư vấn doanh nghiệp', hint: 'Phân tích vấn đề và đề xuất giải pháp.' },

    { code: 'team', label: 'Tìm đồng đội nghiên cứu', hint: 'Kết nối người có chuyên môn bổ sung.' }
  ];
  /* Bậc đào tạo → học vị tối thiểu (theo ghi chú của GV: đại học từ Thạc sĩ, cao học từ Tiến sĩ) */
  var LEVELS = [
    { code: 'dai_hoc', label: 'Đại học', minDegree: 'Thạc sĩ' },
    { code: 'cao_hoc', label: 'Cao học', minDegree: 'Tiến sĩ' }
  ];
  var PUB_TYPES = [
    { code: 'journal', label: 'Bài báo tạp chí', section: 'IV' },
    { code: 'conference', label: 'Bài báo hội nghị', section: 'IV' },
    { code: 'book', label: 'Sách chuyên khảo', section: 'V' },
    { code: 'textbook', label: 'Giáo trình', section: 'V' },
    { code: 'chapter', label: 'Chương sách', section: 'V' }
  ];
  var PUB_STATUS = {
    draft: { label: 'Nháp', tone: 'neutral' },
    needs_file: { label: 'Cần bổ sung', tone: 'warning' },
    pending: { label: 'Đang xử lý', tone: 'info' },
    needs_info: { label: 'Cần bổ sung', tone: 'warning' },
    verified: { label: 'Đã xác minh', tone: 'success' },
    rejected: { label: 'Không đạt', tone: 'danger' }
  };
  var CRED_KINDS = [
    { code: 'degree', label: 'Học vị' },
    { code: 'title', label: 'Chức danh khoa học' },
    { code: 'position', label: 'Chức vụ' }
  ];
  var PROJECT_LEVELS = ['Nhà nước', 'Bộ', 'Ngành', 'Tỉnh/Thành phố', 'Trường', 'Cơ sở', 'Hợp tác doanh nghiệp'];
  var PROJECT_ROLES = ['Chủ nhiệm', 'Thư ký', 'Thành viên chính', 'Thành viên'];

  /* Mục I–II của mẫu LLKH (TT 08/2011/TT-BGDĐT, Phụ lục V). key = cột trong sheet Profiles */
  var PROFILE_FIELDS = [
    { key: 'idType', label: 'Loại giấy tờ', sec: 'X', sensitive: true },
    { key: 'mapLat', label: 'Vĩ độ', sec: 'X', contact: true },
    { key: 'mapLng', label: 'Kinh độ', sec: 'X', contact: true },
    { key: 'mapPlaceId', label: 'Mã địa điểm', sec: 'X', contact: true },
    { key: 'mapConfirmed', label: 'Đã xác nhận ghim', sec: 'X', contact: true },
    { key: 'ugStatus', label: 'Trạng thái đào tạo', sec: 'X' },
    { key: 'ugExpectedYear', label: 'Năm dự kiến tốt nghiệp', sec: 'X' },
    { key: 'hasUg2', label: 'Có bằng đại học thứ hai', sec: 'X' },
    { key: 'hasMaster', label: 'Có bằng thạc sĩ', sec: 'X' },
    { key: 'hasPhd', label: 'Có bằng tiến sĩ', sec: 'X' },
    { key: 'fullName', label: 'Họ và tên', sec: 'I', req: true },
    { key: 'gender', label: 'Giới tính', sec: 'I', req: true },
    { key: 'dob', label: 'Ngày, tháng, năm sinh', sec: 'I', req: true, type: 'date' },
    { key: 'birthPlace', label: 'Nơi sinh', sec: 'I', req: true },
    { key: 'hometown', label: 'Quê quán', sec: 'I' },
    { key: 'ethnicity', label: 'Dân tộc', sec: 'I' },
    { key: 'nationality', label: 'Quốc tịch', sec: 'X' },
    { key: 'addressCountry', label: 'Quốc gia', sec: 'X', contact: true },
    { key: 'ward', label: 'Phường / xã', sec: 'X', contact: true },
    { key: 'position', label: 'Chức vụ (hiện tại hoặc trước khi nghỉ hưu)', sec: 'I' },
    { key: 'unit', label: 'Đơn vị công tác (hiện tại hoặc trước khi nghỉ hưu)', sec: 'I', req: true },
    { key: 'address', label: 'Chỗ ở riêng hoặc địa chỉ liên lạc', sec: 'I', contact: true },
    { key: 'province', label: 'Tỉnh/thành phố', sec: 'I', contact: true },
    { key: 'phoneOffice', label: 'Điện thoại cơ quan', sec: 'I', contact: true },
    { key: 'phoneHome', label: 'Điện thoại nhà riêng', sec: 'I', contact: true },
    { key: 'mobile', label: 'Di động', sec: 'I', contact: true },
    { key: 'fax', label: 'Fax', sec: 'I', contact: true },
    { key: 'contactEmail', label: 'E-mail', sec: 'I', contact: true },
    { key: 'idNumber', label: 'Số căn cước / CMND lịch sử', sec: 'I', contact: true, sensitive: true },
    { key: 'idDate', label: 'Ngày cấp', sec: 'I', contact: true, sensitive: true, type: 'date' },
    { key: 'idPlace', label: 'Nơi cấp', sec: 'I', contact: true, sensitive: true },
    { key: 'field', label: 'Lĩnh vực chuyên môn', sec: 'X', req: true },
    { key: 'keywords', label: 'Từ khóa chuyên môn', sec: 'X' },
    { key: 'orcid', label: 'ORCID', sec: 'X' },
    { key: 'scholarUrl', label: 'Google Scholar / trang cá nhân', sec: 'X' },
    { key: 'bio', label: 'Giới thiệu ngắn', sec: 'X' },
    { key: 'ugSystem', label: 'Hệ đào tạo', sec: 'II', req: true },
    { key: 'ugPlace', label: 'Nơi đào tạo', sec: 'II', req: true },
    { key: 'ugMajor', label: 'Ngành học', sec: 'II', req: true },
    { key: 'ugCountry', label: 'Nước đào tạo', sec: 'II' },
    { key: 'ugYear', label: 'Năm tốt nghiệp', sec: 'II', req: true },
    { key: 'ug2Major', label: 'Bằng đại học 2', sec: 'II' },
    { key: 'ug2Year', label: 'Năm tốt nghiệp (bằng 2)', sec: 'II' },
    { key: 'msMajor', label: 'Thạc sĩ chuyên ngành', sec: 'II' },
    { key: 'msYear', label: 'Năm cấp bằng thạc sĩ', sec: 'II' },
    { key: 'msPlace', label: 'Nơi đào tạo thạc sĩ', sec: 'II' },
    { key: 'phdMajor', label: 'Tiến sĩ chuyên ngành', sec: 'II' },
    { key: 'phdYear', label: 'Năm cấp bằng tiến sĩ', sec: 'II' },
    { key: 'phdPlace', label: 'Nơi đào tạo tiến sĩ', sec: 'II' },
    { key: 'thesis', label: 'Tên luận án', sec: 'II' },
    { key: 'languages', label: 'Ngoại ngữ', sec: 'II', type: 'json' }
  ];

  /* ---------- Chuỗi ---------- */
  function str(v) { return v == null ? '' : String(v); }
  function trim(v) { return str(v).replace(/\s+/g, ' ').trim(); }
  /** Bỏ dấu tiếng Việt, chữ thường: dùng cho tìm kiếm và so khớp. */
  function fold(s) {
    return str(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase();
  }
  function normTitle(s) { return fold(s).replace(/[^a-z0-9]+/g, ' ').trim(); }
  function normDoi(s) {
    return trim(s).replace(/^https?:\/\/(dx\.)?doi\.org\//i, '').replace(/^doi:\s*/i, '').toLowerCase();
  }
  function isDoi(s) { return /^10\.\d{4,9}\/\S+$/.test(normDoi(s)); }
  function words(s) {
    var stop = { va: 1, cua: 1, cho: 1, trong: 1, voi: 1, cac: 1, nhung: 1, mot: 1, the: 1, and: 1, of: 1, in: 1, for: 1, to: 1, a: 1, an: 1, on: 1, tai: 1, theo: 1, ve: 1, la: 1, co: 1, den: 1, tu: 1 };
    return normTitle(s).split(' ').filter(function (w) { return w.length > 1 && !stop[w]; });
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }

  /* ---------- Ngày ---------- */
  /** Nhận dd/mm/yyyy, d-m-yyyy, yyyy-mm-dd, hoặc chỉ năm. Trả { iso, ok, partial }. */
  function parseDate(s) {
    s = trim(s);
    if (!s) return { iso: '', ok: false };
    var m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if (m) return mk(+m[1], +m[2], +m[3]);
    m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/);
    if (m) return mk(+m[3], +m[2], +m[1]);
    m = s.match(/ng[aà]y\s*(\d{1,2})\s*th[aá]ng\s*(\d{1,2})\s*n[aă]m\s*(\d{4})/i);
    if (m) return mk(+m[3], +m[2], +m[1]);
    m = s.match(/^(\d{1,2})[\/.\-](\d{4})$/);
    if (m) return { iso: m[2] + '-' + pad(+m[1]) + '-01', ok: true, partial: 'month' };
    m = s.match(/^(\d{4})$/);
    if (m) return { iso: m[1] + '-01-01', ok: true, partial: 'year' };
    return { iso: '', ok: false };
    function mk(y, mo, d) {
      var dt = new Date(Date.UTC(y, mo - 1, d));
      var ok = y > 1900 && y < 2100 && dt.getUTCMonth() === mo - 1 && dt.getUTCDate() === d;
      return { iso: ok ? y + '-' + pad(mo) + '-' + pad(d) : '', ok: ok };
    }
  }
  function fmtDate(iso) {
    var m = str(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);
    return m ? m[3] + '/' + m[2] + '/' + m[1] : str(iso);
  }
  function yearOf(s) { var m = str(s).match(/(19|20)\d{2}/); return m ? m[0] : ''; }

  /* ---------- Học vị, chức danh ---------- */
  function rankOf(list, value) {
    var f = fold(value);
    for (var i = 0; i < list.length; i++) {
      if (fold(list[i].label) === f || fold(list[i].code) === f) return list[i].rank;
    }
    return 0;
  }
  /** Chuẩn hóa chữ tự do ("TS.", "tiến sỹ", "Ph.D") về nhãn danh mục. */
  function normDegree(s) {
    var f = fold(s).replace(/[^a-z ]/g, ' ').replace(/\s+/g, ' ').trim();
    if (!f) return '';
    if (/tien sy khoa hoc|tien si khoa hoc|tskh|dsc/.test(f)) return 'Tiến sĩ khoa học';
    if (/tien s|^ts\b|phd|ph d|doctor/.test(f)) return 'Tiến sĩ';
    if (/thac s|^ths\b|master|^ms\b|mba/.test(f)) return 'Thạc sĩ';
    if (/ky su|engineer/.test(f)) return 'Kỹ sư';
    if (/cu nhan|bachelor|dai hoc/.test(f)) return 'Cử nhân';
    return '';
  }
  function normTitleRank(s) {
    var f = fold(s);
    if (/pho giao su|pgs/.test(f)) return 'Phó Giáo sư';
    if (/giao su|\bgs\b|professor/.test(f)) return 'Giáo sư';
    return '';
  }
  /**
   * Học vị / chức danh cao nhất ĐÃ XÁC MINH. Xếp theo thứ bậc danh mục, không lấy mục nhập sau cùng.
   * creds: [{ kind, value, date, status }]
   */
  function highest(creds, kind, list) {
    list = list || (kind === 'title' ? TITLES : DEGREES);
    var best = null;
    (creds || []).forEach(function (c) {
      if (c.kind !== kind || c.status !== 'verified') return;
      var r = rankOf(list, c.value);
      if (kind === 'position') r = 1;
      if (!best || r > best.rank || (r === best.rank && str(c.date) > str(best.date))) {
        best = { value: c.value, date: c.date, rank: r, id: c.id };
      }
    });
    return best;
  }
  /** Đủ điều kiện vai trò theo bậc đào tạo (hội đồng / hướng dẫn). */
  function eligible(degree, levelCode, rules, list) {
    var lv = null;
    (rules || LEVELS).forEach(function (l) { if (l.code === levelCode) lv = l; });
    if (!lv) return { ok: !levelCode, reason: levelCode ? 'Bậc đào tạo chưa có trong quy chế đơn vị.' : '' };
    var have = rankOf(list || DEGREES, degree), need = rankOf(list || DEGREES, lv.minDegree);
    if (!degree) return { ok: false, reason: 'Chưa có học vị đã xác minh. Cần tối thiểu ' + lv.minDegree + ' cho bậc ' + lv.label + '.' };
    if (have < need) return { ok: false, reason: 'Bậc ' + lv.label + ' cần tối thiểu ' + lv.minDegree + '; học vị đã xác minh: ' + degree + '.' };
    return { ok: true, reason: 'Đạt điều kiện học vị tối thiểu (' + lv.minDegree + ').' };
  }

  /* ---------- Mức hoàn thiện hồ sơ ---------- */
  /** Trạng thái đại học: 'studying' (sinh viên chưa tốt nghiệp) | 'graduated' | '' (chưa khai). Hiểu cả chữ nhập tay như "Chưa", "Đang học". */
  function ugState(p) {
    p = p || {};
    var s = fold(p.ugStatus || ''), y = fold(p.ugYear || '');
    if (s === 'studying' || /dang hoc|chua tot nghiep|sinh vien/.test(s)) return 'studying';
    if (s === 'graduated' || /da tot nghiep/.test(s)) return 'graduated';
    if (/^(19|20)\d{2}$/.test(trim(p.ugYear))) return 'graduated';
    if (/chua|dang hoc|du kien|sinh vien|hien nay/.test(y)) return 'studying';
    return '';
  }
  function completeness(p, d) {
    p = p || {}; d = d || {};
    var missing = [], total = 0, have = 0;
    PROFILE_FIELDS.forEach(function (f) {
      if (!f.req) return;
      total++;
      if (trim(p[f.key]) || (f.key === 'ugYear' && ugState(p) === 'studying')) have++; else missing.push({ key: f.key, label: f.label, sec: f.sec });
    });
    var extra = [
      { ok: !!d.degree, label: 'Học vị đã xác minh', sec: 'cred' },
      { ok: (d.work || 0) > 0, label: 'Quá trình công tác', sec: 'work' },
      { ok: (d.pubs || 0) > 0, label: 'Ít nhất một công bố', sec: 'pubs' },
      { ok: (d.needsFile || 0) === 0, label: 'Minh chứng cho mọi công bố', sec: 'pubs' }
    ];
    extra.forEach(function (x) { total++; if (x.ok) have++; else missing.push({ key: x.sec, label: x.label, sec: x.sec }); });
    return { pct: total ? Math.round(have * 100 / total) : 0, missing: missing };
  }

  /* ---------- Công bố: khử trùng ---------- */
  function firstAuthor(a) { return normTitle(str(a).split(/[;,]| và | and /)[0]).split(' ').pop() || ''; }
  /** Cùng DOI → trùng. Không DOI → tiêu đề chuẩn hóa + năm (+ họ tác giả đầu nếu có). */
  function sameWork(a, b) {
    var da = normDoi(a.doi), db = normDoi(b.doi);
    if (da && db) return da === db;
    if (normTitle(a.title) !== normTitle(b.title) || !normTitle(a.title)) return false;
    if (yearOf(a.year) && yearOf(b.year) && yearOf(a.year) !== yearOf(b.year)) return false;
    var fa = firstAuthor(a.authors), fb = firstAuthor(b.authors);
    return !(fa && fb && fa !== fb);
  }
  function findDup(p, list) {
    for (var i = 0; i < (list || []).length; i++) {
      if (list[i].id !== p.id && list[i].status !== 'rejected' && sameWork(p, list[i])) return list[i];
    }
    return null;
  }
  /** Danh sách không trùng (giữ bản ghi đầu tiên theo thứ tự). */
  function dedupe(list) {
    var out = [];
    (list || []).forEach(function (p) { if (!findDup(p, out)) out.push(p); });
    return out;
  }
  function pubNeedsFile(p) { return !p.fileId && p.status !== 'rejected'; }

  /* ---------- Ghép nối ---------- */
  function needOn(n, code) {
    if (!n) return false;
    var map = { council: 'council', supervise: 'supervise', consult: 'consult', joint: 'jointResearch', guest: 'guestLecture', team: 'teamUp' };
    return String(n[map[code]]).toLowerCase() === 'true';
  }
  /**
   * Chấm điểm một chuyên gia cho một nhu cầu. Lọc điều kiện TRƯỚC, rồi mới xếp hạng.
   * e = { profile, needs, degree, pubs }, need = { needType, level, tags, goal }
   */
  function matchScore(e, need, today, rules) {
    var reasons = [], blockers = [];
    var n = e.needs || {};
    if (!needOn(n, need.needType)) blockers.push('Chưa bật nhu cầu "' + labelOf(NEED_TYPES, need.needType) + '".');
    if (n.availability && n.availability !== 'ready') blockers.push('Đang tạm dừng nhận đề xuất.');
    if (n.until && today && str(n.until) < str(today)) blockers.push('Thời hạn nhận đề xuất đã hết (' + fmtDate(n.until) + ').');
    if (String(n.allowSuggest).toLowerCase() === 'false') blockers.push('Không nhận đề xuất qua hệ thống.');
    if (need.level && (need.needType === 'council' || need.needType === 'supervise')) {
      var el = eligible(e.degree, need.level, rules);
      if (!el.ok) blockers.push(el.reason);
    }
    var p = e.profile || {};
    var corpus = fold([p.field, p.keywords, p.bio, n.teachField, n.consultField, n.researchDirection]
      .concat((e.pubs || []).filter(function (x) { return x.status !== 'rejected'; }).map(function (x) { return x.title + ' ' + (x.keywords || ''); }))
      .join(' | '));
    var score = 0, hits = [];
    (need.tags || []).forEach(function (t) {
      var ft = fold(trim(t));
      if (ft && corpus.indexOf(ft) >= 0) { score += 22; hits.push(t); }
    });
    var ws = words(need.goal), wh = 0;
    ws.forEach(function (w) { if (w.length > 2 && corpus.indexOf(w) >= 0) wh++; });
    score += Math.min(30, wh * 5);
    if (needOn(n, need.needType)) { score += 20; reasons.push('Đang bật nhu cầu ' + labelOf(NEED_TYPES, need.needType).toLowerCase()); }
    if (hits.length) reasons.push('Trùng chủ đề: ' + hits.join(', '));
    if (wh) reasons.push(wh + ' từ khóa mục tiêu xuất hiện trong hồ sơ/công bố');
    var verifiedPubs = (e.pubs || []).filter(function (x) { return x.status === 'verified'; }).length;
    if (verifiedPubs) { score += Math.min(10, verifiedPubs * 3); reasons.push(verifiedPubs + ' công bố đã xác minh'); }
    if (e.degree) reasons.push('Học vị: ' + e.degree);
    score = Math.min(100, score);
    return {
      score: score, eligible: blockers.length === 0, blockers: blockers, reasons: reasons,
      band: score >= 60 ? 'high' : score >= 30 ? 'mid' : 'low'
    };
  }
  function labelOf(list, code) {
    for (var i = 0; i < list.length; i++) if (list[i].code === code) return list[i].label;
    return code || '';
  }

  /* ---------- Thống kê theo kỳ ---------- */
  function periodKey(iso, by) {
    var m = str(iso).match(/^(\d{4})-(\d{2})/);
    if (!m) return '';
    return by === 'quarter' ? m[1] + '-Q' + Math.ceil(+m[2] / 3) : m[1] + '-' + m[2];
  }
  function periodLabel(key) {
    var q = key.match(/^(\d{4})-Q(\d)$/);
    if (q) return 'Quý ' + q[2] + '/' + q[1];
    var m = key.match(/^(\d{4})-(\d{2})$/);
    return m ? 'Tháng ' + m[2] + '/' + m[1] : key;
  }
  /** Ngày dùng để thống kê: "upload" = lần tải lên đầu tiên; "publish" = năm/tháng xuất bản. */
  function statDate(p, basis) {

  function credential(x, today, degrees, titles) {

    if (!SL.trim(x.value) || (list && list.indexOf(x.value) < 0)) throw new Error('Chọn học vị/chức danh trong danh mục; chức vụ được nhập tự do.');

  }
  return { date:date, year:year, phone:phone, profile:profile, project:project, credential:credential, sortPubs:sortPubs, results:results, evidenceDecision:evidenceDecision };

const ICON_SVG = {};

function toast(msg, type, ms) {
  const el = document.createElement('div');
  el.className = 'toast ' + (type || '');
  el.innerHTML = icon(type === 'error' ? 'alert' : type === 'ok' ? 'check' : 'info', 'sm') + '<span>' + esc(msg) + '</span>';
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), ms || (type === 'error' ? 9000 : 4200));
}
function busy(on) { S.busy += on ? 1 : -1; if (S.busy < 0) S.busy = 0; $('#progress').hidden = S.busy <= 0; workLock(S.busy > 0); }
/* v1.58: khi đang có tác vụ chạy, khóa toàn bộ thao tác (không bấm, không tải thêm file) để tránh chồng chéo.
   Lớp khóa chặn chuột ngay; sau 0,35 giây mới hiện thẻ "Đang xử lý" để thao tác nhanh không bị nháy. */
let LOCK_MSG = '';
function workLock(on) {
  let el = document.getElementById('workLock');
  if (!el) { el = document.createElement('div'); el.id = 'workLock'; el.setAttribute('role', 'status'); el.setAttribute('aria-live', 'polite'); el.innerHTML = '<div class="wl-card"><span class="wl-spin" aria-hidden="true"></span><div><b>Đang xử lý…</b><span class="wl-msg"></span></div></div>'; document.body.appendChild(el); }
  clearTimeout(workLock.t);
  if (on) {
    el.classList.add('on');
    if (document.activeElement && document.activeElement.blur && !document.activeElement.closest('dialog')) document.activeElement.blur();
    el.querySelector('.wl-msg').textContent = LOCK_MSG || 'Vui lòng chờ tác vụ hiện tại hoàn tất.';
    workLock.t = setTimeout(() => { if (S.busy > 0) el.classList.add('show'); }, 350);
  } else { el.classList.remove('on', 'show'); LOCK_MSG = ''; }
}
document.addEventListener('keydown', e => { if (S.busy > 0 && !e.target.closest('dialog') && ['Enter', ' '].includes(e.key)) { e.preventDefault(); e.stopPropagation(); } }, true);
async function call(promise, btn) {
  const session = sessionRevision;
  busy(true);
  if (btn) { btn.classList.add('loading'); btn.disabled = true; }
  try { const result = await promise; if (session !== sessionRevision) throw new Error('cancel: phiên làm việc đã thay đổi'); return result; }
  catch (e) { if (!/^cancel:/.test(e.message || '')) toast(e.message || 'Đã xảy ra lỗi. Thử lại sau.', 'error'); throw e; }
  finally { busy(false); if (btn && document.contains(btn)) { btn.classList.remove('loading'); btn.disabled = false; } }
}
/** Tải lại dữ liệu từ máy chủ rồi vẽ lại trang hiện tại. */
async function refresh() {
  const request = ++refreshRevision, session = sessionRevision, ws = S.ws;
  const d = await call(API.bootstrap(ws));
  if (request !== refreshRevision || session !== sessionRevision || ws !== S.ws) return;
  if (d.state !== 'ok') return boot();
  S.data = d;
  if (wsSection(WS.active)) wsRebuildInPlace(); else route();
}

/* =====================================================================
   FILE: đọc thành base64 (giới hạn 20 MB)
   ===================================================================== */
const FILE_MIME = { pdf: 'application/pdf', doc: 'application/msword', docx: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document', png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', webp: 'image/webp' };
function readFile(file, allowed) {
  return new Promise((res, rej) => {
    if (!file) return rej(new Error('Chưa chọn file.'));
    const ext = (file.name.split('.').pop() || '').toLowerCase();
    const mime = file.type || FILE_MIME[ext] || '';
    if (allowed && allowed.indexOf(ext) < 0) return rej(new Error('Chỉ nhận ' + allowed.map(x => x.toUpperCase()).join(', ') + '.'));
    if (file.size > 20 * 1048576) return rej(new Error('File tối đa 20 MB.'));
    const r = new FileReader();
    r.onload = () => res({ name: file.name, mimeType: mime || FILE_MIME[ext], data: String(r.result).split(',')[1] || '', size: file.size });
    r.onerror = () => rej(new Error('Không đọc được file.'));
    r.readAsDataURL(file);
  });
}
function downloadB64(name, mime, b64) {
  const bin = atob(b64), arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  downloadBlob(name, new Blob([arr], { type: mime }));
}
/** Tải file. Kèm thông báo có liên kết tải lại phòng khi trình duyệt chặn tải tự động trong khung Apps Script. */
function downloadBlob(name, blob) {
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  const el = document.createElement('div');
  el.className = 'toast ok';
  el.innerHTML = icon('check', 'sm') + '<span>Đã tải <b>' + esc(name) + '</b> · <a href="' + url + '" download="' + esc(name) + '" target="_blank" rel="noopener">Chưa thấy file? Tải lại</a></span>';
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), 9000);
  setTimeout(() => URL.revokeObjectURL(url), 120000);
}
async function openFile(id, btn) {
  const f = await call(API.getFile(id), btn);
  downloadB64(f.name, f.mime, f.data);
}
/** Gắn vùng kéo thả: el chứa input[type=file]; cb(file). */
function bindDrop(el, cb) {
  if (!el || el._bound) return;
  el._bound = true;
  const inp = el.querySelector('input[type=file]');
  el.addEventListener('click', e => { if (e.target !== inp) inp.click(); });
  el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); inp.click(); } });
  el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('over'); });
  el.addEventListener('dragleave', () => el.classList.remove('over'));
  el.addEventListener('drop', e => { e.preventDefault(); el.classList.remove('over'); if (S.busy > 0) { toast('Đang có tác vụ chạy. Chờ xong rồi tải file tiếp.', 'error'); return; } if (e.dataTransfer.files[0]) cb(e.dataTransfer.files[0]); });
  inp.addEventListener('change', () => { if (inp.files[0]) cb(inp.files[0]); inp.value = ''; });
}

function combo(name, value, options, opts) {
  opts = opts || {};
  return `<div class="combo" data-combo="${esc(name)}" data-free="${opts.free ? 1 : ''}"><input name="${esc(name)}" value="${esc(value || '')}" autocomplete="off" placeholder="${esc(opts.placeholder || 'Gõ để tìm…')}" role="combobox" aria-expanded="false" ${opts.required ? 'required' : ''}><script type="application/json">${JSON.stringify(options).replace(/</g, '\\u003c')}<\/script></div>`;
}
function comboOpen(wrap) {
  const inp = wrap.querySelector('input');
  const opts = JSON.parse(wrap.querySelector('script').textContent);
  const q = SL.fold(inp.value.trim());
  const hits = opts.filter(o => !q || SL.fold(o).indexOf(q) >= 0).slice(0, 60);
  let list = wrap.querySelector('.combo-list');
  if (!list) { list = document.createElement('div'); list.className = 'combo-list'; list.setAttribute('role', 'listbox'); wrap.appendChild(list); }
  list.innerHTML = hits.length ? hits.map((o, i) => `<button type="button" role="option" data-pick="${esc(o)}" class="${i === 0 ? 'on' : ''}">${esc(o)}</button>`).join('')
    : `<div class="none">Không có kết quả${wrap.dataset.free === '1' ? ' — giữ nội dung bạn gõ' : ''}.</div>`;
  inp.setAttribute('aria-expanded', 'true');
}

document.addEventListener('keydown', e => {
  const w = e.target.closest && e.target.closest('[data-combo]');
  if (!w) return;
  const list = w.querySelector('.combo-list');
  if (!list) return;
  const items = $$('[data-pick]', list), cur = items.findIndex(b => b.classList.contains('on'));
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    const n = Math.max(0, Math.min(items.length - 1, cur + (e.key === 'ArrowDown' ? 1 : -1)));
    items.forEach((b, i) => b.classList.toggle('on', i === n));
    if (items[n]) items[n].scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'Enter' && items[cur]) { e.preventDefault(); w.querySelector('input').value = items[cur].dataset.pick; comboClose(w); w.querySelector('input').dispatchEvent(new Event('change', { bubbles: true })); }
  else if (e.key === 'Escape') comboClose(w);
});

  const pick = e.target.closest('[data-pick]');
  if (pick) { e.preventDefault(); const w = pick.closest('[data-combo]'); w.querySelector('input').value = pick.dataset.pick; comboClose(w); w.querySelector('input').dispatchEvent(new Event('change', { bubbles: true })); return; }
  $$('[data-combo]').forEach(w => { if (!w.contains(e.target)) comboClose(w); });
});

    const sameQ = c && JSON.stringify(c.q) === JSON.stringify(t.q), fromNav = !!link.closest('#nav') && !Object.keys(t.q).length;
    if (wsSection(root) && c && c.page === t.page && (sameQ || fromNav)) { document.body.classList.remove('nav-open'); wsJump(root, sameQ ? t.q : {}); return; }

  if (fn) { if (!tickable) e.preventDefault(); Promise.resolve().then(() => fn(el, e)).catch(err => { if (err && err.message && !/^cancel/.test(err.message)) console.warn(err); }); }
});

<script>

const CV_TEMPLATES = [

const PUB_FILTERS = [['verified', 'Chỉ công bố đã xác minh'], ['pending', 'Đã xác minh + đang chờ duyệt'], ['all', 'Tất cả, trừ bài không đạt (kể cả nháp)']];

function cvModel(src, opts) {

}
function cvFileName(m, tpl) {

  return ({ bgd: 'Ly_lich_khoa_hoc', v2: 'Ly_lich_khoa_hoc_v2', cv: 'CV_hoc_thuat', intro: 'Ho_so_gioi_thieu' }[tpl] || 'Ho_so') + '_' + name;
}
function honor(d) { return [d.title === 'Giáo sư' ? 'GS.' : d.title === 'Phó Giáo sư' ? 'PGS.' : '', d.degree === 'Tiến sĩ khoa học' ? 'TSKH.' : d.degree === 'Tiến sĩ' ? 'TS.' : d.degree === 'Thạc sĩ' ? 'ThS.' : ''].filter(Boolean).join(' '); }

/* ---------- Mảnh ghép (inline style để Word / Google Docs giữ nguyên định dạng) ---------- */
const CV = {
  F: "font-family:'Times New Roman',Times,serif;font-size:13pt;line-height:1.4;color:#000",
  dots: n => '.'.repeat(n || 40),
  /** Ô trống: chỉ mẫu trống (để điền tay) mới in dòng chấm; bản xuất thật để trống cho gọn. */
  blank: false,
  v(val, n) { return val ? `<b style="font-weight:normal">${esc(val)}</b>` : CV.blank ? `<span style="color:#000">${CV.dots(n)}</span>` : ''; },
  /**
   * Nhiều dòng "Nhãn: giá trị" trong MỘT bảng không viền, lưới 20 cột (mỗi cột 5%).
   * Word và Google Docs giữ đúng bố cục nhờ thuộc tính width/colspan (không dựa vào CSS).
   * rows: [{ pairs:[[nhãn, giá trị, số chấm]], w:[%...] } | { head:'1. Đại học:' }]
   */
  grid(rows) {
    const cols = Array.from({ length: 20 }, () => '<col width="5%">').join('');
    const td = (inner, span, extra) => `<td colspan="${span}" width="${span * 5}%" valign="top" style="${CV.F};padding:2pt 6pt 2pt 0;vertical-align:top;${extra || ''}">${inner}</td>`;
    return `<table width="100%" style="width:100%;border-collapse:collapse;margin:0" cellpadding="0" cellspacing="0" border="0"><colgroup>${cols}</colgroup>` + rows.map(r => {
      if (r.head) return `<tr>${td(esc(r.head), 20, 'font-weight:bold;padding-top:6pt')}</tr>`;
      const w = r.w || [100];
      let used = 0;
      const spans = w.map((x, i) => { const n = i === w.length - 1 ? 20 - used : Math.max(1, Math.round(x / 5)); used += n; return n; });
      if (r.note) return `<tr>${td('<i>' + esc(r.pairs[0][0]) + '</i>', 20)}</tr>`;
      return `<tr>${r.pairs.map((pr, i) => td(r.lang && i === 0 ? (CV.blank && !/\S\.\s\S/.test(pr[0]) ? esc(pr[0]) + CV.dots(20) : esc(pr[0])) : `${esc(pr[0])}: ${CV.v(pr[1], pr[2])}`, spans[i])).join('')}</tr>`;
    }).join('') + '</table>';
  },
  line(pairs, widths) {
    return `<table style="width:100%;border-collapse:collapse;margin:0" cellpadding="0" cellspacing="0"><tr>${pairs.map((pr, i) => `<td style="${CV.F};padding:2pt 6pt 2pt 0;vertical-align:top;${widths ? 'width:' + widths[i] + ';' : ''}">${esc(pr[0])}: ${CV.v(pr[1], pr[2])}</td>`).join('')}</tr></table>`;
  },
  h(t) { return `<p style="${CV.F};font-weight:bold;margin:12pt 0 4pt">${esc(t)}</p>`; },
  sub(t) { return `<p style="${CV.F};font-weight:bold;margin:6pt 0 2pt">${esc(t)}</p>`; },
  p(t, extra) { return `<p style="${CV.F};margin:2pt 0;${extra || ''}">${t}</p>`; },
  /** Bảng có viền, hàng tiêu đề in đậm; tự thêm dòng trống cho đủ minRows như mẫu giấy. */
  table(head, rows, widths, minRows) {
    const td = (c, i, th) => `<td valign="top" ${widths && widths[i] ? 'width="' + widths[i] + '"' : ''} style="${CV.F};font-size:12pt;border:1px solid #000;padding:3pt 5pt;vertical-align:top;${th ? 'font-weight:bold;text-align:center;' : ''}${widths && widths[i] ? 'width:' + widths[i] + ';' : ''}${c === 'TT' || /^\d+$/.test(c) ? 'white-space:nowrap;text-align:center;' : ''}">${c}</td>`;
    const body = rows.slice();
    const min = CV.blank ? (minRows || 0) : (rows.length ? 0 : 1);
    while (body.length < min) body.push(head.map(() => '&nbsp;'));
    return `<table width="100%" border="1" style="width:100%;border-collapse:collapse;margin:4pt 0 8pt" cellpadding="0" cellspacing="0"><tr>${head.map((h, i) => td(esc(h), i, true)).join('')}</tr>${body.map(r => `<tr>${r.map((c, i) => td(c, i)).join('')}</tr>`).join('')}</table>`;
  },
  center(t, st) { return `<p style="${CV.F};text-align:center;margin:0;${st || ''}">${t}</p>`; },
  ref(x) {
    const parts = [esc(x.authors || ''), x.year ? '(' + esc(x.year) + ')' : '', '<i>' + esc(x.title) + '</i>', esc(x.venue || '')];
    if (x.volume) parts.push(esc(x.volume) + (x.pages ? ', ' + esc(x.pages) : ''));
    return parts.filter(Boolean).join('. ').replace(/\.\s*\(/, ' (') + (x.doi ? '. https://doi.org/' + esc(x.doi) : '') + '.';
  }
};
function cvHeader(m, opts, st) {

  return code +

    CV.center(opts.tpl === 'bgd' ? '(Mẫu Phụ lục V, Thông tư số 08/2011/TT-BGDĐT ngày 17/02/2011 của Bộ trưởng Bộ GDĐT)' : '(Mẫu đơn vị · bản minh họa v2 — thay bằng biểu mẫu chính thức của đơn vị khi áp dụng)', 'font-style:italic;font-size:11pt;margin:2pt 0 12pt');
}
function cvSign(m, st) {

  return `<p style="${CV.F};text-align:right;font-style:italic;margin:18pt 0 6pt">${esc(st.CITY || (st.BLANK ? '……………' : 'TP. Hồ Chí Minh'))}, ${st.BLANK ? 'ngày …… tháng …… năm ………' : `ngày ${SL.pad(d.getDate())} tháng ${SL.pad(d.getMonth() + 1)} năm ${d.getFullYear()}`}</p>

}
/** Mục I theo mẫu Bộ. Bố cục cột cố định (2 cột 60/40, 3 cột 40/30/30) để chữ thẳng hàng.
    Bản xuất thật: dòng không có dữ liệu được ẩn; liên hệ chỉ in khi chọn "Kèm thông tin liên hệ". Mẫu trống: in đủ mọi dòng. */
const CV_W2 = [60, 40], CV_W3 = [40, 30, 30];
function cvRows(rows) { return rows.filter(r => r.head || CV.blank || !r.opt || r.pairs.some(pr => SL.trim(pr[1]))); }
function cvSecI(m, opts, title) {
  const p = m.p, d = m.d, c = opts.contact || CV.blank;
  const year = s => SL.yearOf(s);
  const rows = [
    { pairs: [['Họ và tên', p.fullName, 40], ['Giới tính', p.gender, 12]], w: CV_W2 },
    { pairs: [['Ngày, tháng, năm sinh', SL.fmtDate(p.dob), 18], ['Nơi sinh', p.birthPlace, 22]], w: CV_W2 },
    { pairs: [['Quê quán', p.hometown, 36], ['Dân tộc', p.ethnicity, 14]], w: CV_W2 },
    { pairs: [['Học vị cao nhất', d.degree, 24], ['Năm, nước nhận học vị', [year(d.degreeDate), m.degCountry].filter(Boolean).join(', '), 16]], w: CV_W2, opt: true },
    { pairs: [['Chức danh khoa học cao nhất', d.title, 16], ['Năm bổ nhiệm', year(d.titleDate), 12]], w: CV_W2, opt: true },
    { pairs: [['Chức vụ (hiện tại hoặc trước khi nghỉ hưu)', p.position || d.position, 40]], w: [100], opt: true },
    { pairs: [['Đơn vị công tác (hiện tại hoặc trước khi nghỉ hưu)', p.unit, 30]], w: [100] }
  ];
  if (c) rows.push(
    { pairs: [['Chỗ ở riêng hoặc địa chỉ liên lạc', contactAddress(p), 50]], w: [100], opt: true },
    { pairs: [['Điện thoại liên hệ: CQ', p.phoneOffice, 10], ['NR', p.phoneHome, 12], ['DĐ', p.mobile, 14]], w: CV_W3, opt: true },
    { pairs: [['Fax', p.fax, 18], ['E-mail', p.contactEmail, 26]], w: CV_W2, opt: true },
    { pairs: [['Số CMND/CCCD', p.idNumber, 14], ['Ngày cấp', SL.fmtDate(p.idDate), 12], ['Nơi cấp', p.idPlace, 14]], w: CV_W3, opt: true });
  if (opts.tpl === 'v2') rows.push({ pairs: [['Lĩnh vực chuyên môn', [p.field, p.keywords].filter(Boolean).join(' · '), 50]], w: [100], opt: true }, { pairs: [['ORCID', p.orcid, 20]], w: [100], opt: true });
  return CV.h(title) + CV.grid(cvRows(rows));
}
function cvSecII(m, title) {
  const p = m.p, has = (...k) => k.some(x => SL.trim(p[x]));
  const ugYear = SL.ugState(p) === 'studying' ? 'Đang học' + (p.ugExpectedYear ? ' (dự kiến ' + p.ugExpectedYear + ')' : '') : p.ugYear;
  const ms = CV.blank || has('msMajor', 'msYear', 'msPlace'), phd = CV.blank || has('phdMajor', 'phdYear', 'phdPlace', 'thesis');
  const langs = m.langs.length ? m.langs : CV.blank ? [{}, {}, {}] : [];
  // Số mục giữ cố định như mẫu Bộ (1. Đại học, 2. Sau đại học, 3. Ngoại ngữ); mục chưa có dữ liệu ghi "Chưa có".
  const none = t => ({ pairs: [[t, '', 0]], w: [100], note: true });
  const rows = [{ head: '1. Đại học:' },
    { pairs: [['Hệ đào tạo', p.ugSystem, 30]], w: [100], opt: true }, { pairs: [['Nơi đào tạo', p.ugPlace, 50]], w: [100] }, { pairs: [['Ngành học', p.ugMajor, 40]], w: [100] },
    { pairs: [['Nước đào tạo', p.ugCountry, 22], ['Năm tốt nghiệp', ugYear, 12]], w: CV_W2 },
    { pairs: [['Bằng đại học 2', p.ug2Major, 22], ['Năm tốt nghiệp', p.ug2Year, 12]], w: CV_W2, opt: true }];
  rows.push({ head: '2. Sau đại học:' });
  if (!ms && !phd) rows.push(none('Chưa có'));
  else {
    if (ms) rows.push({ pairs: [['- Thạc sĩ chuyên ngành', p.msMajor, 22], ['Năm cấp bằng', p.msYear, 12]], w: CV_W2 }, { pairs: [['   Nơi đào tạo', p.msPlace, 50]], w: [100] });
    if (phd) rows.push({ pairs: [['- Tiến sĩ chuyên ngành', p.phdMajor, 22], ['Năm cấp bằng', p.phdYear, 12]], w: CV_W2 }, { pairs: [['   Nơi đào tạo', p.phdPlace, 50]], w: [100] }, { pairs: [['- Tên luận án', p.thesis, 60]], w: [100], opt: true });
  }
  rows.push({ head: '3. Ngoại ngữ:' });
  if (!langs.length) rows.push(none('Chưa có'));
  langs.slice(0, 5).forEach((l, i) => rows.push({ pairs: [[(i + 1) + '. ' + (l.name || ''), '', 0], ['Mức độ sử dụng', l.level, 18]], w: CV_W2, lang: true }));
  return CV.h(title) + CV.grid(cvRows(rows));
}
function cvSecIII(m, title) {
  return CV.h(title) + CV.table(['Thời gian', 'Nơi công tác', 'Công việc đảm nhiệm'],
    m.work.map(w => [esc([w.from, w.to].filter(Boolean).join(' – ')), esc(w.place), esc(w.role)]), ['22%', '40%', '38%'], 3);
}
function cvProjects(m, label) {
  return CV.p(label) + CV.table(['TT', 'Tên đề tài nghiên cứu', 'Năm bắt đầu/Năm hoàn thành', 'Đề tài cấp (NN, Bộ, ngành, trường)', 'Trách nhiệm tham gia trong đề tài'],
    m.projects.map((x, i) => [String(i + 1), esc(x.name), esc([x.from, x.to].filter(Boolean).join('/')), esc(x.level), esc(x.role)]), ['8%', '40%', '17%', '17%', '18%'], 3);
}

}
function cvAwards(m) {
  return CV.table(['TT', 'Tên giải thưởng / khen thưởng', 'Năm', 'Cơ quan trao tặng'], m.awards.map((x, i) => [String(i + 1), esc(x.name), esc(x.year), esc(x.org)]), ['7%', '53%', '12%', '28%'], 2);
}
function cvPubTable(list, label) {

function gdocHtml(body, title) { return '<html><head><meta charset="utf-8"><\u0074itle>' + esc(title) + '<\/\u0074itle><\/head><body>' + body + '<\/body><\/html>'; }
function printBody(body) {
  $('#printArea').innerHTML = `<div class="paper">${body}</div>`;
  document.body.classList.add('printing');
  const done = () => { document.body.classList.remove('printing'); window.removeEventListener('afterprint', done); };

function activateProfileSection(key) {
  const navKey=key==='cred'?'edu':key;
  S.ui.profileActive=key;
  $$('[data-profile-section]').forEach(sec=>{const was=sec.hidden;sec.hidden=sec.dataset.profileSection!==navKey;if(was&&!sec.hidden)animateIn(sec);});
  $$('.profile-tabs [data-profile-jump]').forEach(a=>{if(a.dataset.profileJump===navKey)a.setAttribute('aria-current','location');else a.removeAttribute('aria-current');});
  const save=$('[data-act="profile-save"]');if(save)save.textContent=key==='cred'?'Gửi xác minh':'Lưu mục đang xem';
  if(WS.cur.profile){WS.cur.profile.q=Object.assign({},WS.cur.profile.q,{tab:key});}
  if(S.route.page==='profile')S.route.q.tab=key;
  if(WS.active==='profile'&&!$('.drawer')){const h=wsHash('profile',WS.cur.profile?WS.cur.profile.q:{tab:key});try{window.history.replaceState(null,'',h);}catch(e){}WS.lastHash=location.hash;}
}
function scrollProfileSection(key,behavior) {
  const section=$('#profile-'+key);if(!section)return;
  activateProfileSection(key);
  if(key==='cred')section.scrollIntoView({block:'start',behavior:'auto'});else window.scrollTo(0,0);
  section.focus({preventScroll:true});
}
function mountProfileScroll(q) {
  // v1.58: các thẻ trong hồ sơ là phần tách biệt, không theo dõi cuộn
  const k=(q && q.tab) || S.ui.profileActive || 'basic';activateProfileSection(PROFILE_TABS.some(t=>t[0]===k) || k==='cred'?k:'basic');return;
  const sections=$$('[data-profile-section],[data-profile-anchor]');if(!sections.length)return;
  let pending=false,disposed=false;
  const update=()=>{
    pending=false;if(disposed||!sections[0].isConnected||WS.active!=='profile')return;
    const nav=$('.profile-tabs');const line=nav?nav.getBoundingClientRect().bottom+32:160;
    let current=sections[0];for(const section of sections){if(section.getBoundingClientRect().top<=line)current=section;else break;}
    const pb=wsSection('profile');if(pb&&pb.getBoundingClientRect().bottom<=line+80)current=sections[sections.length-1];
    activateProfileSection(current.dataset.profileSection||current.dataset.profileAnchor);
  };
  const onScroll=()=>{if(pending)return;pending=true;(window.requestAnimationFrame||((fn)=>setTimeout(fn,16)))(update);};
  window.addEventListener('scroll',onScroll,{passive:true});
  disposeProfileScroll=()=>{disposed=true;window.removeEventListener('scroll',onScroll);};
  const preserve=S.ui.keepScroll;
  setTimeout(()=>{if(disposed||!sections[0].isConnected)return;update();},0);
}

  if(tab==='basic') return `<div class="grid2"><form data-form="profile" class="stack" id="basicProfileForm"><div class="card profile-card"><h2 class="h2">Thông tin cá nhân</h2><p class="caption">${reqMark()} Trường bắt buộc cho hồ sơ. Căn cước là thông tin bổ sung theo mẫu.</p><div class="identity-grid">${fieldInput('fullName')}${fieldInput('dob',{label:'Ngày sinh'})}${fieldInput('gender',{select:['Nam','Nữ']})}</div><div class="category-grid">${fieldInput('ethnicity',{list:ETHNIC,free:true})}${fieldInput('nationality',{list:COUNTRIES,free:true})}${fieldInput('birthPlace',{list:PROVINCES,free:true})}</div><hr class="div"><h3 class="h3">Thông tin liên hệ</h3><div class="contact-grid">${fieldInput('contactEmail',{label:'Email liên hệ'})}${fieldInput('mobile',{label:'Di động Việt Nam',hint:'10 chữ số (03/05/07/08/09), hoặc +84 thay số 0.'})}</div><div class="category-grid">${fieldInput('addressCountry',{list:COUNTRIES,free:true})}${fieldInput('province',{list:PROVINCES,free:true,hint:'Địa chỉ hiện tại hoặc tên trên giấy tờ; giữ được địa danh cũ.'})}${fieldInput('ward',{label:'Phường / xã',list:[...new Set((d.profiles || [p]).map(x=>x.ward).filter(Boolean))],free:true})}</div>${fieldInput('address',{c:'c12',label:'Địa chỉ chi tiết'})}${mapCard()}</div><details class="card profile-more"><summary>Thông tin khác của lý lịch</summary><div class="fgrid">${fieldInput('hometown',{c:'c4',list:PROVINCES,free:true})}${fieldInput('position',{c:'c4'})}${fieldInput('unit',{c:'c4'})}${fieldInput('phoneOffice',{c:'c4'})}${fieldInput('phoneHome',{c:'c4'})}${fieldInput('fax',{c:'c4'})}<label class="field c12"><span>Loại giấy tờ</span><select name="idType" data-id-type>${[['identity','Thẻ căn cước (mẫu từ 01/07/2024)'],['cccd','Căn cước công dân (CCCD)'],['legacy','CMND — chỉ lưu lịch sử']].map(x=>`<option value="${x[0]}" ${(p.idType || (/^\d{9}$/.test(p.idNumber || '')?'legacy':'cccd'))===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select><span class="hint">CCCD/căn cước: đúng 12   if(tab==='edu') return `<div class="stack">${academicSummary()}<form data-form="profile" class="stack" id="academicProfileForm"><div class="card"><h3 class="h2">1. Đại học</h3><div class="fgrid"><label class="field c12"><span>Trạng thái đào tạo${reqMark()}</span><select name="ugStatus" data-ug-status>${(()=>{const st=SL.ugState(p) || (S.data.derived.degree?'graduated':'studying');return [['studying','Đang học — sinh viên chưa tốt nghiệp'],['graduated','Đã tốt nghiệp']].map(o=>`<option value="${o[0]}" ${st===o[0]?'selected':''}>${o[1]}</option>`).join('');})()}</select><span class="hint">Sinh viên chưa tốt nghiệp chọn "Đang học": không cần năm tốt nghiệp, lý lịch in "Đang học".</span></label>${fieldInput('ugSystem',{list:['Chính quy','Vừa làm vừa học','Liên thông','Văn bằng 2','Từ xa'],free:true})}${fieldInput('ugPlace')}${fieldInput('ugMajor')}${fieldInput('ugCountry',{list:COUNTRIES,free:true})}<div data-ug-year class="c12">${fieldInput('ugYear',{c:'c6',required:true})}</div><div data-ug-expected class="c12 conditional">${fieldInput('ugExpectedYear',{c:'c6',required:false,hint:'Không bắt buộc. VD: 2029.'})}</div></div>${toggleBlock('hasUg2','Đã có bằng đại học thứ hai',['ug2Major','ug2Year'])}</div><div class="card"><h3 class="h2">2. Sau đại học</h3>${toggleBlock('hasMaster','Đã có bằng thạc sĩ',['msMajor','msYear','msPlace'])}${toggleBlock('hasPhd','Đã có bằng tiến sĩ',['phdMajor','phdYear','phdPlace','thesis'])}<p class="caption">Thông tin đào tạo phục vụ bản in. Bằng cấp và chức danh dùng xét điều kiện được gửi xác minh riêng phía dưới. Không bắt buộc có thạc sĩ trước tiến sĩ.</p></div><div class="card"><div class="row between"><h3 class="h2">3. Ngoại ngữ</h3><button type="button" class="btn sm" data-act="lang-add">Thêm ngoại ngữ</button></div><div class="stack" style="margin-top:12px">${(S.drafts.langs || (S.drafts.langs=(()=>{try{return JSON.parse(p.languages || '[]');}catch(e){return [];}})())).map((l,i)=>`<div class="fgrid" data-lang="${i}"><label class="field c6"><span>Ngoại ngữ</span>${combo('lang-name',l.name,['Tiếng Anh','Tiếng Pháp','Tiếng Đức','Tiếng Nhật','Tiếng Hàn','Tiếng Trung'],{free:true})}</label><label class="field c6"><span>Mức độ sử dụng</span><div class="row"><input name="lang-level" value="${esc(l.level || '')}" placeholder="B2 / IELTS 7.0 / thành thạo"><button type="button" class="iconbtn" data-act="lang-del" data-i="${i}" aria-label="Xóa">${icon('trash','sm')}</button></div></label></div>`).join('')}</div></div><button class="btn primary">Lưu đào tạo</button></form></div>`;
  if(tab==='cred') {
    const cs=d.credentials.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)));
    return `<div class="grid2"><div class="card"><h3 class="h2">Lịch sử học vị, chức danh, chức vụ</h3><p class="caption">Học vị/chức danh cao nhất chỉ tính từ mục đã xác minh. AI đối chiếu nội dung; quản trị viên xử lý mục chưa rõ.</p>${cs.length?`<div class="stack">${cs.map(x=>`<article class="credential-row"><div class="row between"><b>${esc(x.value)}</b>${credBadge(x)}</div><p class="caption">${esc(SL.labelOf(SL.CRED_KINDS,x.kind))} · ${esc(SL.fmtDate(x.date))} · ${esc(x.issuer || x.country || '')}${x.recognitionDate?'<br>Công nhận đạt tiêu chuẩn: '+esc(SL.fmtDate(x.recognitionDate)):''}${x.decisionNo?'<br>Quyết định: '+esc(x.decisionNo):''}</p>${x.fileId?`<button type="button" class="btn sm" data-act="open-file" data-id="${esc(x.fileId)}">Xem ${esc(x.fileName)}</button>`:`<label class="btn sm">Tải minh chứng<input type="file" hidden accept=".pdf,.png,.jpg,.jpeg" data-cred-file="${esc(x.id)}"></label>`}${aiStatusHTML(x)}${x.reviewNote?`<p class="caption">${esc(x.reviewNote)}</p>`:''}${x.fileId&&x.status!=='verified'?`<button type="button" class="btn sm" data-act="ai-retry" data-kind="cred" data-id="${esc(x.id)}">Kiểm tra lại AI</button>`:''}${x.status!=='verified'?`<button type="button" class="btn sm" data-act="cred-edit" data-id="${esc(x.id)}">Bổ sung thông tin</button><button type="button" class="btn sm" data-act="cred-del" data-id="${esc(x.id)}">Rút yêu cầu</button>`:''}</article>`).join('')}</div>`:emptyState('shield','Chưa có mục nào.')}</div><form class="card" data-form="cred" id="credentialForm"><h3 class="h3">Thêm mục cần xác minh</h3><input type="hidden" name="id"><div class="stack" style="margin-top:12px"><label class="field"><span>Loại${reqMark()}</span><select name="kind" data-act-change="cred-kind">${SL.CRED_KINDS.map(k=>`<option value="${k.code}">${k.label}</option>`).join('')}</select></label><label class="field" id="credValue"><span>Giá trị${reqMark()}</span><select name="value" required><option value="">— Chọn —</option>${E.degrees().map(x=>`<option>${esc(x)}</option>`).join('')}</select></label><label class="field"><span id="credentialDateLabel">Ngày cấp bằng${reqMark()}</span><input name="date" placeholder="dd/mm/yyyy" inputmode="numeric" required></label><div class="stack conditional" data-title-extra hidden><label class="field"><span>Ngày công nhận đạt tiêu chuẩn (nếu có)</span><input name="recognitionDate" placeholder="dd/mm/yyyy" inputmode="numeric"></label><label class="field"><span>Số quyết định bổ nhiệm${reqMark()}</span><input name="decisionNo" required></label></div><label class="field"><span>Nước nhận bằng / bổ nhiệm${reqMark()}</span>${combo('country','Việt Nam',COUNTRIES,{free:true,required:true})}</label><label class="field"><span>Cơ quan cấp bằng / quyết định${reqMark()}</span><input name="issuer" required></label><label class="field"><span>File minh chứng (PDF, ảnh)${reqMark()}</span><input type="file" name="file" required accept=".pdf,.png,.jpg,.jpeg"><span class="hint">AI nhận tối đa 12 MB. Minh chứng được gửi Gemini để đối chiếu thông tin đã khai.</span></label><label class="field"><span>Ghi chú cho người duyệt</span><x-ta name="note" rows="2"></x-ta></label><button class="btn primary">Gửi xác minh</button><p class="caption">Lỗi AI hoặc nội dung chưa rõ sẽ được báo cụ thể, giữ trong hàng chờ quản trị viên.</p></div></form></div>`;
  }
  return listEditor(tab);
}

VIEWS.expert.profile = {
  crumb: () => 'Không gian chuyên gia / Hồ sơ của tôi',
  render(q) {
    const intro={basic:'Thông tin cá nhân và liên hệ',edu:'Đào tạo, ngoại ngữ và học vị',work:'Quá trình công tác chuyên môn',projects:'Hoạt động nghiên cứu',awards:'Giải thưởng và khen thưởng'};
    const shownTab=PROFILE_TABS.some(t=>t[0]===(q.tab || S.ui.profileActive))?(q.tab || S.ui.profileActive):(q.tab || S.ui.profileActive)==='cred'?'edu':'basic';
    const sections=PROFILE_TABS.map(([key,label],i)=>`<section class="profile-section" id="profile-${key}" data-profile-section="${key}" tabindex="-1" ${key===shownTab?'':'hidden'}><div class="profile-section-heading"><span>0${i+1}</span><div><h2>${label}</h2><p>${intro[key]}</p></div></div>${renderProfileSection(key)}${key==='edu'?`<div id="profile-cred" class="profile-credentials" data-profile-anchor="cred" tabindex="-1"><h3 class="h2">Học vị & chức danh đã xác minh</h3>${renderProfileSection('cred')}</div>`:''}</section>`).join('');
    const active=shownTab;
    return (pageHead('Hồ sơ của tôi','Chọn từng thẻ để xem và chỉnh sửa; mỗi thẻ lưu riêng.',`<button type="button" class="btn" data-act="go" data-page="import">${icon('upload')}Nhập từ CV</button><button type="button" class="btn primary" data-act="profile-save">Lưu mục đang xem</button>`)+`<nav class="tabs fit profile-tabs" aria-label="Điều hướng trong hồ sơ">${PROFILE_TABS.map(([key,label])=>`<a href="#/profile?tab=${key}" data-profile-jump="${key}" ${key===active?'aria-current="location"':''}>${label}</a>`).join('')}</nav><div id="draftNote" class="caption draft-note" role="status" hidden>Có thay đổi chưa lưu · Nội dung được giữ khi chuyển mục trong phiên này.</div><div class="profile-continuous">${sections}</div>`).replace(/href="#\/profile\?tab=(basic|edu|cred|work|projects|awards)"(?! data-profile-jump)/g,(_,key)=>`href="#/profile?tab=${key}" data-profile-jump="${key}"`);
  },
  mount(q) {
    mountProfileScroll(q);
    $$('[data-cred-file]').forEach(inp => inp.addEventListener('change', async () => {
      const f = await readFile(inp.files[0], ['pdf', 'png', 'jpg', 'jpeg']).catch(e => toast(e.message, 'error'));
      if (!f) return;
      await call(API.uploadFile(f, 'cred:' + inp.dataset.credFile));
      toast('Đã tải minh chứng.', 'ok'); refresh();
    }));
    const k = $('select[name=kind]');
    if (k) k.addEventListener('change', () => {
      const box = $('#credValue');
      box.innerHTML = '<span>Giá trị *</span>' + (k.value === 'degree' ? `<select name="value">${E.degrees().map(x => `<option>${esc(x)}</option>`).join('')}</select>` : k.value === 'title' ? `<select name="value">${E.titles().map(x => `<option>${esc(x)}</option>`).join('')}</select>` : '<input name="value" placeholder="Ví dụ: Trưởng bộ môn">');
    });
  }
};
ACT['profile-save'] = () => { const key=S.ui.profileActive||S.route.q.tab||'basic';const section=$('#profile-'+key);const f=section&&$('form[data-form=profile],form[data-form=list],form[data-form=cred]',section);if(f)f.requestSubmit(); };
ACT['form-profile'] = async (f, e) => {
  const o = formData(f);
  delete o['lang-name']; delete o['lang-level'];
  if ($('[data-lang]', f)) o.languages = $$('[data-lang]', f).map(r => ({ name: $('[name=lang-name]', r).value.trim(), level: $('[name=lang-level]', r).value.trim() })).filter(l => l.name);
  const btn = f.querySelector('button.primary');
  const languageSnapshot = JSON.stringify(S.drafts.langs);
  const r = await call(API.saveProfile(o), btn);
  discardFormDraft(f);
  if (JSON.stringify(S.drafts.langs) === languageSnapshot) { S.drafts.langs = null; delete S.structuredDirty.langs; }
  S.data.profile = r.profile;
  toast('Đã lưu hồ sơ.', 'ok');
  refresh();
};
ACT['lang-add'] = () => { S.structuredDirty.langs = true; S.drafts.langs = $$('[data-lang]').map(r => ({ name: $('[name=lang-name]', r).value, level: $('[name=lang-level]', r).value })).concat([{ name: '', level: '' }]); S.ui.keepScroll = true; route(); };
ACT['lang-del'] = el => { S.structuredDirty.langs = true; S.drafts.langs = $$('[data-lang]').map(r => ({ name: $('[name=lang-name]', r).value, level: $('[name=lang-level]', r).value })).filter((x, i) => i !== +el.dataset.i); S.ui.keepScroll = true; route(); };
ACT['list-add'] = el => {
  const k=el.dataset.kind;S.structuredDirty[k]=true;
  S.drafts[k]=readListDom(k).concat([{id:''}]);
  (S.ui.listSort || (S.ui.listSort={}))[k]='manual';
  if(k==='projects')S.ui.projectOpen=S.drafts[k].length-1;
  S.ui.keepScroll=true;route();
  const row=$$(`form[data-kind="${k}"] [data-list-row]`).at(-1);
  if(row){row.scrollIntoView({block:'nearest',behavior:'auto'});const input=$('textarea,input:not([type=hidden])',row);if(input)input.focus({preventScroll:true});}
};
ACT['list-del'] = async el => {
  const k=el.dataset.kind,i=+el.dataset.i,rows=readListDom(k),row=rows[i];if(!row)return;
  if((row.id || row.name || row.place) && !await confirmBox('Xóa mục này?',row.name || row.place || 'Mục này sẽ bị xóa khi lưu danh sách.','Xóa',true))return;
  S.drafts[k]=rows.filter((_,n)=>n!==i);S.structuredDirty[k]=true;
  if(k==='projects')S.ui.projectOpen=S.ui.projectOpen===i?null:S.ui.projectOpen>i?S.ui.projectOpen-1:S.ui.projectOpen;
  S.ui.keepScroll=true;route();
};
ACT['form-list'] = async f => {
  const k = f.dataset.kind, rows = readListDom(k).filter(r => !isBlankRow(r));
  S.drafts[k] = rows;
  const submittedRows = JSON.stringify(rows);
  const r = await call(API.saveList(k, rows), f.querySelector('button.primary'));
  if (JSON.stringify(S.drafts[k]) === submittedRows) { S.drafts[k] = null; delete S.structuredDirty[k]; if(k==='projects')S.ui.projectOpen=null; }
  toast('Đã lưu ' + r.rows.length + ' dòng.', 'ok');
  refresh();
};
ACT['form-cred'] = async f => {
  const o = formData(f), btn = f.querySelector('button.primary');
  const file = f.querySelector('input[type=file]').files[0];
  let fd = null;
  if (file) fd = await readFile(file, ['pdf', 'png', 'jpg', 'jpeg']).catch(e => { toast(e.message, 'error'); });
  if (file && !fd) return;
  const r = await call(API.addCredential({ kind: o.kind, value: o.value, date: o.date, country: o.country, note: o.note }), btn);
  if (fd) await call(API.uploadFile(fd, 'cred:' + r.credential.id), btn);
  discardFormDraft(f);
  toast('Đã gửi xác minh ' + r.credential.value + '.', 'ok');
  refresh();
};
ACT['cred-del'] = async el => {
  if (!await confirmBox('Rút yêu cầu xác minh?', 'Mục này sẽ bị xóa khỏi hàng chờ của quản trị viên.', 'Rút yêu cầu', true)) return;
  await call(API.withdrawCredential(el.dataset.id)); refresh();
};

/* ---------- Nhập hồ sơ từ CV: Tải CV → Kiểm tra thông tin → Xác nhận lưu ---------- */
const IMP_GROUPS = [['basic', 'Thông tin cơ bản & liên hệ', ['I']], ['edu', 'Đào tạo', ['II']]];
function impState() { return S.imp || (S.imp = { step: 1 }); }
function impItems() {
  const im = impState(), dr = im.draft, items = [];
  if (!dr) return items;
  Object.keys(dr.fields).forEach(k => {
    const f = SL.PROFILE_FIELDS.find(x => x.key === k);
    if (!f) return;
    const cur = E.profile()[k] || '';
    const v = dr.fields[k].value;
    if (!SL.trim(v)) return;   // không đề xuất ô trống
    if (k === 'ugYear' && dr.fields.ugStatus && dr.fields.ugStatus.value === 'studying') return;
    const same = SL.fold(cur) === SL.fold(v);
    if (k === 'ugStatus') { items.push({ id: 'f:' + k, group: 'Đào tạo', label: f.label, key: k, value: v === 'studying' ? 'Đang học (chưa tốt nghiệp)' : 'Đã tốt nghiệp', cur: cur ? (SL.ugState({ ugStatus: cur }) === 'studying' ? 'Đang học (chưa tốt nghiệp)' : 'Đã tốt nghiệp') : '', same: SL.ugState({ ugStatus: cur }) === v, kind: 'field', flag: dr.fields[k].flag }); return; }
    items.push({ id: 'f:' + k, group: f.sec === 'II' ? 'Đào tạo' : 'Thông tin cá nhân', label: f.label, key: k, value: f.type === 'date' ? SL.fmtDate(v) : v, cur: f.type === 'date' ? SL.fmtDate(cur) : cur, flag: dr.fields[k].flag, same, kind: 'field' });
  });
  dr.credentials.forEach((c, i) => items.push({ same: S.data.credentials.some(r => r.kind === c.kind && SL.fold(r.value) === SL.fold(c.value) && r.status !== 'rejected'), id: 'c:' + i, group: 'Học vị, chức danh, chức vụ', label: SL.labelOf(SL.CRED_KINDS, c.kind), value: c.value, date: c.date ? SL.fmtDate(c.date) : '', flag: c.flag || (!c.date ? 'Cần ngày đạt để gửi xác minh.' : ''), kind: 'cred', c }));
  if (dr.languages.length) items.push({ id: 'lang', group: 'Đào tạo', label: 'Ngoại ngữ', value: dr.languages.map(l => l.name + (l.level ? ' (' + l.level + ')' : '')).join('; '), kind: 'lang' });
  [['work', 'Quá trình công tác', w => [w.from, w.to].filter(Boolean).join('–') + ' · ' + w.place + ' · ' + w.role], ['projects', 'Đề tài', x => x.name + ' (' + [x.from, x.to].filter(Boolean).join('/') + ', ' + (x.level || '—') + ', ' + (x.role || '—') + ')'], ['awards', 'Giải thưởng', x => x.name + (x.year ? ' (' + x.year + ')' : '')]].forEach(([k, g, fmt]) => {
    const keyOf = r => SL.fold([r.from, r.place, r.name, r.year].join('|')).replace(/[^a-z0-9|]/g, '');
    const have = new Set((S.data[k] || []).map(keyOf));
    dr[k].forEach((x, i) => items.push({ id: k + ':' + i, group: g, label: g, value: fmt(x), flag: x.flag, kind: k, row: x, same: have.has(keyOf(x)) }));
  });
  dr.pubs.concat(dr.books).forEach((p, i) => items.push({ id: 'p:' + i, group: 'Công bố, giáo trình', label: pubType(p.type) + ' · ' + (p.year || '?'), value: p.title, sub: [p.authors, p.venue, p.doi && 'DOI ' + p.doi].filter(Boolean).join(' · '), flag: p.flag, dup: p.dup, kind: 'pub', p }));
  return items;
}

/** Danh sách CV đã tải lên: "Điền nhanh" đọc lại file cũ (lỗi / quá thời gian) mà không phải tải lên lần nữa. */
function cvFilesCard() {
  const files = ((S.data && S.data.files) || []).filter(f => f.kind === 'cv').sort((a, b) => String(b.uploadedAt).localeCompare(String(a.uploadedAt))).slice(0, 5);
  if (!files.length) return '';
  return `<div class="card"><div class="h3">Điền nhanh từ file đã tải lên</div><p class="caption" style="margin:4px 0 12px">File lần trước bị lỗi hoặc quá thời gian? Bấm <b>Điền nhanh</b> để đọc lại ngay, không cần tải lên lần nữa. Muốn dùng file khác thì kéo thả ở khung phía trên.</p>
    <div class="list cv-files">${files.map(f => `<div class="li"><div class="grow"><b>${esc(f.name)}</b><span class="sub">Tải lên ${esc(fmtDT(f.uploadedAt))}${f.size ? ' · ' + Math.max(1, Math.round(+f.size / 1024)) + ' KB' : ''}</span></div><button type="button" class="btn sm primary" data-act="cv-refill" data-id="${esc(f.id)}" data-name="${esc(f.name)}">${icon('refresh', 'sm')}Điền nhanh</button></div>`).join('')}</div></div>`;
}
ACT['cv-refill'] = async el => {

  try {
    const r = await call(API.reparseCV(el.dataset.id), el);
    Object.assign(im, { step: 2, draft: r.draft, source: r.source, fileRow: r.file, sel: null, pubAct: null, edits: {} });
    go('import');
  } catch (e) { im.error = e.message; route(); }
};
function impRow(it) {
  const im = impState(), on = im.sel[it.id];
  const val = (im.edits || {})[it.id] != null ? im.edits[it.id] : it.value;
  const editable = it.kind === 'field' || it.kind === 'cred';
  return `<div class="rev-item ${on ? '' : 'skip'}"><input type="checkbox" ${on ? 'checked' : ''} data-act="imp-toggle" data-id="${esc(it.id)}" aria-label="Chọn mục" style="width:18px;height:18px;margin-top:12px;accent-color:var(--sl-brand-default)">
    <div><div class="label muted">${esc(it.label)}${it.same ? ' · giống hồ sơ hiện tại' : ''}</div>
    ${editable ? `<div class="field ${it.flag ? 'invalid' : ''}" style="margin-top:4px"><input data-imp-edit="${esc(it.id)}" value="${esc(val)}" data-act="imp-src" data-q="${esc(it.value)}">${it.kind === 'cred' ? `<input data-imp-edit="${esc(it.id)}#date" value="${esc((im.edits || {})[it.id + '#date'] != null ? im.edits[it.id + '#date'] : it.date)}" placeholder="Ngày đạt dd/mm/yyyy" style="margin-top:6px">` : ''}</div>`
      : `<div style="margin-top:4px;cursor:pointer" data-act="imp-src" data-q="${esc(it.kind === 'pub' ? it.value : (it.row && (it.row.place || it.row.name)) || it.value)}"><b class="strong">${esc(it.value)}</b>${it.sub ? `<div class="caption">${esc(it.sub)}</div>` : ''}</div>`}
    ${it.flag ? `<div class="flag">${esc(it.flag)}</div>` : ''}${it.cur && !it.same ? `<div class="caption">Hồ sơ hiện tại: ${esc(it.cur)}</div>` : ''}
    ${it.dup ? `<div class="panel-warn" style="margin-top:8px"><b class="strong">Có thể đã tồn tại</b><div class="caption">Cùng DOI hoặc trùng tiêu đề + năm: "${esc(it.dup.title)}" (${esc(SL.PUB_STATUS[it.dup.status] ? SL.PUB_STATUS[it.dup.status].label : it.dup.status)})</div></div>` : ''}</div>
    <div>${it.kind === 'pub' ? `<label class="field"><span class="sr">Cách xử lý</span><select data-act-change="imp-pubact" data-id="${esc(it.id)}">${(it.dup ? [['skip', 'Giữ dữ liệu hiện tại'], ['merge', 'Gộp vào bài đã có'], ['add', 'Vẫn thêm bản mới']] : [['add', 'Thêm mới (nháp)'], ['skip', 'Bỏ qua']]).map(o => `<option value="${o[0]}" ${im.pubAct[it.id] === o[0] ? 'selected' : ''}>${o[1]}</option>`).join('')}</select></label>` : `<span class="caption">${it.kind === 'field' ? (it.cur ? 'Cập nhật' : 'Thêm') : it.kind === 'cred' ? 'Chờ xác minh' : 'Thêm vào cuối'}</span>`}</div></div>`;

document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset && t.dataset.actChange === 'imp-pubact') { impState().pubAct[t.dataset.id] = t.value; if (t.value !== 'skip') impState().sel[t.dataset.id] = true; }

ACT['cv-pick'] = () => $('#cvDrop input').click();
ACT['imp-reset'] = () => { S.imp = { step: 1 }; go('import'); };
/* Quay lại bước 1 nhưng GIỮ bản nháp AI đã đọc: không phải chờ AI đọc lại. */
ACT['imp-back1'] = () => { impState().step = 1; S.ui.keepScroll = false; go('import'); };
ACT['imp-resume'] = () => { const im = impState(); if (im.draft) { im.step = 2; go('import'); } };
ACT['imp-toggle'] = el => { const im = impState(); im.sel[el.dataset.id] = el.checked; el.closest('.rev-item').classList.toggle('skip', !el.checked); };
ACT['imp-src'] = el => {
  const box = $('#srcBox'); if (!box) return;
  const q = String(el.dataset.q || '').slice(0, 60), src = impState().source;
  if (!q) return;
  const i = src.toLowerCase().indexOf(q.toLowerCase().slice(0, 40));
  if (i < 0) { box.innerHTML = esc(src); return; }
  box.innerHTML = esc(src.slice(0, i)) + '<mark id="srcHit">' + esc(src.slice(i, i + q.length)) + '</mark>' + esc(src.slice(i + q.length));
  const hit = $('#srcHit'); if (hit) box.scrollTop = hit.offsetTop - box.offsetTop - 80;
};
ACT['imp-skip-flagged'] = () => { const im = impState(); impItems().forEach(it => { if (it.flag) im.sel[it.id] = false; }); S.ui.keepScroll = true; route(); };
ACT['imp-next'] = () => {
  const im = impState();
  const bad = impItems().filter(it => it.kind === 'cred' && im.sel[it.id] && it.c.kind !== 'position' && !SL.parseDate((im.edits || {})[it.id + '#date'] != null ? im.edits[it.id + '#date'] : it.date).ok);
  if (bad.length) { toast('Nhập ngày đạt (dd/mm/yyyy) cho ' + bad.map(b => b.value).join(', ') + ' hoặc bỏ chọn mục đó.', 'error'); return; }
  im.step = 3; go('import');
};
ACT['imp-back'] = () => { impState().step = 2; go('import'); };
ACT['imp-save'] = async el => {
  if (!$('#impAgree').checked) { toast('Đánh dấu xác nhận đã kiểm tra dữ liệu.', 'error'); return; }

  items.filter(it => im.sel[it.id]).forEach(it => {
    const v = ed[it.id] != null ? ed[it.id] : it.value;
    if (it.kind === 'field') plan.fields[it.key] = v;
    else if (it.kind === 'cred') plan.credentials.push({ kind: it.c.kind, value: v, date: ed[it.id + '#date'] != null ? ed[it.id + '#date'] : it.date, country: it.c.country || '' });
    else if (it.kind === 'lang') plan.languages = im.draft.languages;

  });
  const r = await call(API.importCV(plan), el);
  S.imp = { step: 1 };
  toast('Đã lưu hồ sơ: thêm ' + r.added + ' công bố, gộp ' + r.merged + '.', 'ok');
  S.data = r.data; renderShell();
  go('pubs', { src: 'cv' });
};

/* Tải minh chứng ngay từ danh sách: chọn file → xác nhận quyền lưu → tải lên. Xong bài này thì gợi ý bài tiếp theo còn thiếu file. */
ACT['pub-quick-upload'] = el => {
  if (S.busy > 0) { toast('Đang có tác vụ chạy. Chờ xong rồi tải file tiếp.', 'error'); return; }
  const id = el.dataset.id, title = el.dataset.title || 'công bố';
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.pdf,.doc,.docx'; inp.style.display = 'none';
  document.body.appendChild(inp);
  inp.addEventListener('change', async () => {
    const file = inp.files[0]; inp.remove(); if (!file) return;
    const ok = await confirmBox('Tải minh chứng', `Tải <b>${esc(file.name)}</b> làm minh chứng cho bài <b>${esc(title)}</b>?<p class="caption" style="margin:8px 0 0">Bạn xác nhận có quyền lưu bản tài liệu này trong hồ sơ. PDF, DOC, DOCX · tối đa 20 MB.</p>`, 'Tải lên');
    if (!ok) return;
    const fd = await readFile(file, ['pdf', 'doc', 'docx']).catch(e => { toast(e.message, 'error'); });
    if (!fd) return;
    LOCK_MSG = 'Đang tải ' + file.name + '…';
    try { await call(API.uploadFile(fd, 'pub:' + id)); } catch (e) { return; }
    toast('Đã tải minh chứng cho "' + title + '".', 'ok');
    await refresh();
  }, { once: true });
  inp.click();
};

function pubFormData() { const f = $('#pubForm'); return f ? formData(f) : {}; }
ACT['pub-save'] = async el => {
  const q = S.route.q, a = el.dataset.a;
  const form = $('#pubForm'), routeAtStart = location.hash;
  beginFormSave(form);
  const data = Object.assign(pubFormData(), { id: q.id || '' });
  const meta = S.ui.meta && S.ui.meta.id === (q.id || '') ? S.ui.meta : null;
  if (meta) { data.metaStatus = meta.status; data.metaNote = (meta.notes || []).join(' '); }
  let r = await call(API.savePublication(data, a), el);
  if (!r.ok && r.dup) {
    const okDup = await confirmBox('Công bố có thể đã tồn tại', `Trùng với <b>${esc(r.dup.title)}</b> (${esc(r.dup.year)}). Cùng DOI chỉ tính một bản ghi trong thống kê.<br><br>Vẫn lưu thành bản ghi riêng?`, 'Vẫn lưu');
    if (!okDup) { go('pub', { id: r.dup.id }); return; }
    r = await call(API.savePublication(Object.assign(data, { confirmDup: true }), a), el);
  }
  discardFormDraft(form);
  S.drafts.pub = form && !form._draftSaved ? Object.assign(formData(form), { id: r.pub.id }) : null; S.ui.meta = null;
  toast(a === 'submit' ? (r.ai ? r.ai.note : 'Đã gửi xác minh.') : 'Đã lưu bản nháp.', r.ai && r.ai.aiStatus==='error'?'error':'ok');
  await refresh();
  if (location.hash === routeAtStart) go('pub', { id: r.pub.id });
};
ACT['pub-del'] = async el => {

ACT['pub-meta'] = async el => {
  const x = pubFormData();
  if (!x.doi) { toast('Nhập DOI để đối chiếu.', 'error'); return; }
  S.drafts.pub = Object.assign({ id: S.route.q.id || undefined }, x);
  const r = await call(API.checkDoi(x.doi, x.title, x.year), el);
  S.ui.meta = Object.assign({ id: S.route.q.id || '' }, r);
  if (S.route.q.id) API.setPubMeta(S.route.q.id, r.status, (r.notes || []).join(' ')).catch(() => {});
  S.ui.keepScroll = true; route();
};
ACT['pub-meta-apply'] = () => {
  const m = S.ui.meta && S.ui.meta.meta; if (!m) return;
  const x = Object.assign(pubFormData(), { title: m.title || undefined, year: m.year || undefined, authors: m.authors || undefined, venue: m.venue || undefined, issn: m.issn || undefined, volume: m.volume || undefined, pages: m.pages || undefined });
  Object.keys(x).forEach(k => x[k] === undefined && delete x[k]);
  S.drafts.pub = Object.assign({ id: S.route.q.id || undefined }, x);
  S.ui.meta = Object.assign({}, S.ui.meta, { status: 'match', notes: [] });
  S.ui.keepScroll = true; route(); toast('Đã điền theo Crossref. Kiểm tra rồi lưu.', 'ok');
};

ACT['quick-parse'] = () => {
  const text = $('#quickText').value;
  const lines = text.split(/\r?\n/).map(s => s.trim()).filter(s => s.length > 8);
  if (!lines.length) { toast('Dán ít nhất một dòng trích dẫn.', 'error'); return; }
  const existing = S.data.pubs;
  const rows = lines.map(l => { const r = SL.parseRef(l); r.type = /hoi nghi|conference|proceedings|ky yeu/.test(SL.fold(l)) ? 'conference' : /giao trinh/.test(SL.fold(l)) ? 'textbook' : 'journal'; r.dup = SL.findDup(r, existing); r.on = !r.dup; return r; });
  S.ui.quick = { text, rows }; S.ui.keepScroll = true; route();
};
ACT['quick-clear'] = () => { S.ui.quick = null; route(); };
ACT['quick-toggle'] = el => { S.ui.quick.rows[+el.dataset.i].on = el.checked; el.closest('.rev-item').classList.toggle('skip', !el.checked); };
ACT['quick-save'] = async el => {
  const rows = S.ui.quick.rows.filter(r => r.on);
  if (!rows.length) { toast('Chọn ít nhất một bài.', 'error'); return; }
  let ok = 0;
  for (const r of rows) {
    const x = { title: r.title, authors: r.authors || S.data.profile.fullName || '', year: r.year || String(new Date().getFullYear()), venue: r.venue || '(cần bổ sung)', doi: r.doi, type: r.type, confirmDup: true };
    try { const res = await call(API.savePublication(x, 'draft'), el); if (res.ok) ok++; } catch (e) {}
  }
  S.ui.quick = null;
  toast('Đã lưu ' + ok + ' bài ở dạng nháp.', 'ok');
  await refresh(); go('pubs', { s: 'draft' });
};

ACT['demo-reset'] = async () => { if (!await confirmBox('Đặt lại dữ liệu demo?', 'Mọi thay đổi trong bản demo trên trình duyệt này sẽ bị xóa.', 'Đặt lại', true)) return; MockAPI.reset(); toast('Đã đặt lại.', 'ok'); refresh(); };

<script>
/* =====================================================================
   XUẤT HỒ SƠ (chuyên gia: hồ sơ của mình · quản trị: CV đầy đủ một người theo quyền)
   Hai điểm kiểm tra: xem toàn bộ → xác nhận bản xem trước → xuất.
   Đổi dữ liệu, mục hoặc mẫu sau khi xác nhận ⇒ hủy xác nhận cũ.
   ===================================================================== */
function expSrc(email) {
  const d = S.data;
  if (S.ws === 'expert') return { email: d.me.email, profile: d.profile, derived: d.derived, credentials: d.credentials, work: d.work, projects: d.projects, pubs: d.pubs, awards: d.awards, needs: d.needs || {} };
  const by = a => (a || []).filter(x => x.email === email);
  return { email, profile: d.profiles.find(p => p.email === email) || { email, fullName: nameOf(email) }, derived: d.derivedAll[email] || {}, credentials: by(d.credentials), work: by(d.work), projects: by(d.projects), pubs: by(d.pubs), awards: by(d.awards), needs: d.needsAll.find(n => n.email === email) || {} };
}
function expState() {
  if (!S.exp) S.exp = { tab: 'form', tpl: 'bgd', format: API.demo ? 'doc' : 'docx', sections: {}, contact: false, pubFilter: 'verified', confirmed: '', confirmedAt: '', extra: null };
  return S.exp;
}
function hashStr(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return String(h); }
function expSig(src, st) { return hashStr(JSON.stringify([st.tpl, st.sections, st.contact, st.pubFilter, st.extra, src])); }
function expOpts(st) { return { tpl: st.tpl, sections: st.sections, contact: st.tpl === 'intro' ? false : st.contact, pubFilter: st.pubFilter, extra: st.tpl === 'bgd' ? (st.extra || {}) : {} }; }
const EXP_SCOPES = [
  ['std', 'Mẫu chuẩn', 'Đúng Thông tư 08/2011 · mục I–IV', {}],
  ['books', 'Mẫu chuẩn + Sách, giáo trình', 'Thêm mục V: sách chuyên khảo, giáo trình, chương sách', { books: true }],
  ['awards', 'Mẫu chuẩn + Giải thưởng', 'Thêm mục giải thưởng, khen thưởng', { awards: true }],
  ['all', 'Mẫu chuẩn + Sách, giáo trình + Giải thưởng', 'Đầy đủ nhất', { books: true, awards: true }]
];
function expScopeKey(x) { x = x || {}; return x.books && x.awards ? 'all' : x.books ? 'books' : x.awards ? 'awards' : 'std'; }
/** Hỏi phạm vi nội dung trước khi xuất lý lịch theo mẫu Bộ. Trả về false nếu người dùng hủy. */
async function expAskScope(q) {
  const st = expState(), m = cvModel(expSrc(q.e), expOpts(st)), cur = expScopeKey(st.extra);
  const cnt = { books: m.books.length + ' sách/giáo trình', awards: m.awards.length + ' giải thưởng' };
  const r = await openDialog({

   KHÔNG GIAN QUẢN TRỊ
   ===================================================================== */
function experts() {
  const d = S.data;
  return d.users.filter(u => String(u.roles).split(',').includes('expert')).map(u => {
    const by = a => a.filter(x => x.email === u.email);
    const profile = d.profiles.find(p => p.email === u.email) || {}, pubs = by(d.pubs), creds = by(d.credentials), work = by(d.work);
    const der = d.derivedAll[u.email] || {}, needs = d.needsAll.find(n => n.email === u.email) || {};
    const comp = SL.completeness(profile, { degree: der.degree, work: work.length, pubs: pubs.length, needsFile: pubs.filter(SL.pubNeedsFile).length });
    const pending = creds.some(c => c.status === 'pending') || pubs.some(p => p.status === 'pending');
    const status = pending ? ['Chờ xác minh', 'info'] : comp.pct < 80 || !der.degree ? ['Cần bổ sung', 'warning'] : ['Đã xác minh', 'success'];
    return { email: u.email, user: u, name: profile.fullName || u.name, unit: profile.unit || u.unit, field: profile.field || '', profile, pubs, creds, work, der, needs, comp, status };
  });
}
function needsText(n) { return SL.NEED_TYPES.filter(t => SL.needOn(n, t.code)).map(t => t.label.replace('Nghiên cứu chung với DN', 'Nghiên cứu chung DN')); }

const RV_KIND = { acc: ['Tài khoản', 'info', 'key'], cred: ['Học vị / chức danh', 'warning', 'shield'], pub: ['Công bố', 'ai', 'file'] };
function rvQueues() {
  const d = S.data;
  const acc = (d.users || []).filter(u => u.status === 'pending').map(u => ({ k: 'acc', id: u.email, email: u.email, at: u.createdAt, title: 'Xin quyền sử dụng Fluxience', sub: u.email, raw: u }));
  const cred = d.credentials.filter(c => c.status === 'pending').map(c => ({ k: 'cred', id: c.id, email: c.email, at: c.createdAt, title: SL.labelOf(SL.CRED_KINDS, c.kind) + ': ' + c.value, sub: [SL.fmtDate(c.date), c.fileId ? 'có minh chứng' : 'chưa có minh chứng'].filter(Boolean).join(' · '), raw: c }));
  const pub = d.pubs.filter(p => p.status === 'pending').map(p => ({ k: 'pub', id: p.id, email: p.email, at: p.uploadedAt, title: p.title, sub: [pubType(p.type), p.venue, p.year].filter(Boolean).join(' · '), raw: p }));
  const byAge = (a, b) => String(a.at || '').localeCompare(String(b.at || ''));
  [acc, cred, pub].forEach(l => l.sort(byAge));

}
function rvDone() {
  const d = S.data, res = { verified: ['Đã xác minh', 'success'], approve: ['Đã cấp quyền', 'success'], needs_info: ['Cần bổ sung', 'warning'], rejected: ['Không ghi nhận', 'danger'], reject: ['Đã từ chối', 'danger'] };

  d.credentials.filter(c => c.reviewedAt && c.status !== 'pending').forEach(c => out.push({ k: 'cred', email: c.email, at: c.reviewedAt, by: c.reviewedBy, title: SL.labelOf(SL.CRED_KINDS, c.kind) + ': ' + c.value, note: c.reviewNote, res: res[c.status] || ['—', ''] }));
  d.pubs.filter(p => p.reviewedAt && p.status !== 'pending').forEach(p => out.push({ k: 'pub', email: p.email, at: p.reviewedAt, by: p.reviewedBy, title: p.title, note: p.reviewNote, res: res[p.status] || ['—', ''] }));

/* v1.64 · Chuyển động: mục mới hiện ra trượt nhẹ + số liệu đếm lên. Tắt hết khi người dùng chọn giảm chuyển động. */
const REDUCED = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
function animateIn(el) {
  if (!el || REDUCED()) return;
  el.classList.remove('fx-enter'); void el.offsetWidth; el.classList.add('fx-enter');
  // Các thẻ lần lượt hiện lên (so le 70ms) để mắt kịp theo dõi
  $$('.page-head, .card, .sum-tile, .kpi, .callout', el).filter(c => !c.closest('dialog')).slice(0, 14).forEach((c, i) => {
    c.classList.remove('fx-card'); void c.offsetWidth; c.style.animationDelay = (120 + i * 70) + 'ms'; c.classList.add('fx-card');
  });
  $$('.sum-tile b, .kpi .k-val', el).forEach(n => {
    const txt = n.textContent, m = txt.match(/^(\d+)(.*)$/); if (!m || +m[1] === 0 || n._counting) return;
    const end = +m[1], rest = m[2], t0 = performance.now() + 250, dur = Math.min(1400, 700 + end * 25); n._counting = true;
    const tick = now => { const k = Math.max(0, Math.min(1, (now - t0) / dur)), e = 1 - Math.pow(1 - k, 3); n.textContent = Math.round(end * e) + rest; if (k < 1) requestAnimationFrame(tick); else { n.textContent = txt; n._counting = false; } };

}
/** v1.64 · Biểu đồ cột "Công bố theo năm": một chuỗi, một màu (brand), gốc ở trục 0, đầu cột bo 4px,

function yearChart(pubs, title, id) {
  const by = {};

  const ys = Object.keys(by).sort();
  if (!ys.length) return `<div class="card yc"><div class="h3">${esc(title)}</div><p class="caption" style="margin:8px 0 0">Chưa có công bố có năm xuất bản.</p></div>`;
  const all = []; for (let y = +ys[0]; y <= +ys[ys.length - 1]; y++) all.push(String(y));   // năm trống vẫn hiện (cột 0) để không méo trục thời gian
  const shown = all.slice(-12), max = Math.max(...shown.map(y => by[y] || 0)), last = shown[shown.length - 1], top = shown.find(y => (by[y] || 0) === max);
  const total = shown.reduce((a, y) => a + (by[y] || 0), 0);
  const step = max <= 4 ? 1 : Math.ceil(max / 4), ticks = []; for (let t = 0; t <= max; t += step) ticks.push(t); if (ticks[ticks.length - 1] < max) ticks.push(ticks[ticks.length - 1] + step);
  const ceil = ticks[ticks.length - 1] || 1;
  return `<div class="card yc" id="${esc(id || '')}"><div class="row between"><div><div class="h3">${esc(title)}</div><div class="caption">${total} công bố · ${esc(shown[0])}–${esc(last)}${all.length > 12 ? ' (12 năm gần nhất)' : ''}</div></div></div>
    <div class="yc-plot" role="img" aria-label="${esc(title + ': ' + shown.map(y => y + ' có ' + (by[y] || 0)).join(', '))}">
      <div class="yc-grid" aria-hidden="true">${ticks.slice().reverse().map(t => `<div><span>${t}</span></div>`).join('')}</div>
      <div class="yc-bars">${shown.map((y, i) => { const v = by[y] || 0, h = v / ceil * 100; return `<div class="yc-col" tabindex="0" data-tip="${esc(y + ': ' + v + ' công bố')}"><div class="yc-bar-wrap">${(y === top || y === last) && v ? `<b class="yc-val" style="bottom:calc(${h}% + 4px)">${v}</b>` : ''}<i class="yc-bar" style="height:${h}%;animation-delay:${250 + i * 80}ms"></i></div><small>${esc(y)}</small></div>`; }).join('')}</div>
    </div>
    <details class="yc-table"><summary>Xem dạng bảng</summary><table class="tbl"><thead><tr><th>Năm</th><th>Số công bố</th></tr></thead><tbody>${shown.slice().reverse().map(y => `<tr><td>${esc(y)}</td><td class="num">${by[y] || 0}</td></tr>`).join('')}</tbody></table></details></div>`;
}

/* Explicit loading plus FontFace status prevents mistaking a fallback for QDP. */
async function inspectQdpFonts(fonts, timeoutMs = 5000) {
  const specs = [
    ['Fluxience Inter', '400'], ['Fluxience Inter', '500'], ['Fluxience Inter', '600'], ['Fluxience Inter', '700'],
    ['Fluxience QDP Sans', '400'], ['Fluxience QDP Sans', '500'], ['Fluxience QDP Display', '400'], ['Fluxience QDP Display', '500']
  ];
  if (!fonts || typeof fonts.load !== 'function') return specs.map(([family, weight]) => ({ family, weight, loaded: false, reason: 'unsupported' }));
  let timer;
  const requests = Promise.all(specs.map(async ([family, weight]) => {
    try {
      const faces = await fonts.load(weight + ' 16px "' + family + '"', 'Hồ sơ khoa học Đặng Nguyễn');
      const loaded = Array.from(faces).some(face => String(face.family).replace(/["']/g, '') === family && (String(face.weight) === weight || /^\d+ \d+$/.test(String(face.weight))) && face.status === 'loaded');
      return { family, weight, loaded, reason: loaded ? '' : 'missing' };
    } catch (e) { return { family, weight, loaded: false, reason: 'error' }; }
  }));
  try {
    return await Promise.race([requests, new Promise(resolve => {
      timer = setTimeout(() => resolve(specs.map(([family, weight]) => ({ family, weight, loaded: false, reason: 'timeout' }))), timeoutMs);
    })]);
  } finally { clearTimeout(timer); }
}

/* Tra link/DOI → TỰ ĐIỀN metadata Crossref vào biểu mẫu.
   Bài mới (chưa có tên): điền toàn bộ. Bài đã có nội dung: chỉ điền ô trống, phần lệch hiện để người dùng chọn "Điền theo Crossref". */
/** Ghi giá trị thẳng vào ô của biểu mẫu công bố (để cơ chế giữ bản nháp không chép đè giá trị cũ khi vẽ lại). */
function fillPubForm(vals) {
  const f=$('#pubForm');if(!f)return;
  Object.keys(vals).forEach(k=>{const el=f.elements.namedItem(k);if(el && el.value!==undefined && vals[k]!=null){el.value=vals[k];el.dispatchEvent(new Event('input',{bubbles:true}));}});
}
const CROSSREF_TYPE={'journal-article':'journal','proceedings-article':'conference','book':'book','monograph':'book','edited-book':'book','book-chapter':'chapter'};
ACT['pub-meta']=async el=>{
  const x=pubFormData();if(!x.doi && !x.sourceUrl){toast('Dán link bài báo hoặc DOI rồi bấm lại.','error');return;}
  const before=JSON.stringify(x), r=await call(API.lookupPublication(x.sourceUrl || x.doi,x.title,x.year),el);
  if(JSON.stringify(pubFormData())!==before){toast('Nội dung đã thay đổi trong lúc tra; bấm lại để điền.','info');return;}
  const m=r && r.meta;
  if(!r || !r.found || !m){S.drafts.pub=Object.assign({id:S.route.q.id || undefined},x);S.ui.meta=Object.assign({id:S.route.q.id || ''},r || {});S.ui.keepScroll=true;route();toast('Crossref không có DOI này. Kiểm tra lại link hoặc nhập tay.','error',7000);return;}
  const fresh=!SL.trim(x.title), owner=SL.trim(S.data.profile && S.data.profile.fullName), out=Object.assign({},x), filled=[];
  const put=(k,v,label)=>{v=SL.trim(v);if(!v)return;const cur=SL.trim(out[k]);
    const replaceable=fresh || !cur || (k==='authors' && cur===owner) || (k==='year' && cur===String(new Date().getFullYear()) && !x.doi);
    if(replaceable && cur!==v){out[k]=v;filled.push(label);}};
  put('title',m.title,'tên bài');put('authors',m.authors,'tác giả');put('venue',m.venue,'tạp chí');put('year',m.year,'năm');
  put('issn',m.issn,'ISSN');put('volume',m.volume,'tập');put('pages',m.pages,'trang');put('doi',m.doi,'DOI');
  if(fresh && CROSSREF_TYPE[m.type])out.type=CROSSREF_TYPE[m.type];
  const same=SL.normTitle(out.title)===SL.normTitle(m.title) && (!m.year || String(out.year)===String(m.year));
  fillPubForm(out);
  S.drafts.pub=Object.assign({id:S.route.q.id || undefined},out);
  S.ui.meta=Object.assign({id:S.route.q.id || ''},r,same?{status:'match',notes:[]}:{});
  S.ui.keepScroll=true;route();
  toast(filled.length?'Đã điền từ Crossref: '+filled.join(', ')+'. Kiểm tra rồi lưu.':same?'Thông tin đã khớp Crossref.':'Có chỗ khác Crossref: xem khung Metadata bên phải và bấm "Điền theo Crossref" nếu muốn thay.',filled.length || same?'ok':'info',7000);
};
ACT['pub-meta-apply']=()=>{

  const v={title:m.title,year:m.year,authors:m.authors,venue:m.venue,issn:m.issn,volume:m.volume,pages:m.pages,doi:m.doi};
  Object.keys(v).forEach(k=>{if(!v[k])delete v[k];});

  S.ui.keepScroll=true;route();toast('Đã điền theo Crossref. Kiểm tra rồi lưu.','ok');
};
